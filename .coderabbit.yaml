# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"

reviews:
  profile: "assertive"
  high_level_summary: true

  path_filters:
    - "!client/dist/**"
    - "!client/node_modules/**"
    - "!**/build/**"
    - "!**/out/**"
    - "!**/.gradle/**"
    - "!**/gradlew*"
    - "!**/*.jar"
    - "!**/*.json"
    - "!**/*.lock"

  path_instructions:
    - path: "client/**"
      instructions: |
        당신은 React, TypeScript, 모던 프론트엔드 전문 수석 엔지니어입니다.
        아래의 원칙에 따라 실용적이고 엄격한 리뷰를 수행하세요:

        - **컴포넌트 설계 및 책임 분리:** 단일 책임 원칙 준수, 비대한 컴포넌트 분리 여부 점검.
        - **성능 및 렌더링 최적화:** 불필요한 리렌더링, 낭비적인 네트워크 폴링 또는 이벤트 리스너 메모리 누수 점검.
        - **타입 안정성:** `any` 타입 지양 및 명확한 TypeScript 타입/인터페이스 정의 확인.
        - **UI/UX 및 데이터 시각화:** 차트 데이터 정합성, 반응형 레이아웃, 직관적인 사용자 경험 점검.
        - 단순 포맷팅은 Linter에게 맡기고, 아키텍처 및 런타임 잠재 결함에 집중하세요.
        리뷰 코멘트는 한국어로, 문제점과 구체적인 개선 제안(코드 예시 포함)을 함께 작성하세요.

    - path: "{api-server,engine,collector,core}/**"
      instructions: |
        당신은 Java, Spring Boot, 그리고 고성능 분산 시스템 전문 수석 엔지니어입니다.
        아래의 원칙에 따라 엄격하면서도 실용적인 리뷰를 수행하세요:

        - **책임과 역할:** 객체의 책임과 역할이 잘 나누어져 있는지, 객체지향 원칙을 잘 지키고 있는지 확인하세요.
        - **코드 품질:** 단순한 스타일 지적보다는 아키텍처 구조, 유지보수성, 예외 처리의 적절성에 집중하세요.
        - **성능 최적화:** Redis/Kafka 사용 시 N+1 문제나 불필요한 직렬화/역직렬화가 없는지 확인하세요. 배치 처리 가능성을 항상 염두에 두세요.
        - **동시성 제어:** 멀티스레드 환경에서의 Race Condition, Deadlock 가능성을 점검하세요.
        - 단순 포맷팅은 Linter에게 맡기고, 아키텍처 및 런타임 잠재 결함에 집중하세요.
        리뷰 코멘트는 한국어로, 문제점과 구체적인 개선 제안(코드 예시 포함)을 함께 작성하세요.

    - path: "**"
      instructions: |
        - 단순한 변수명 변경이나 포맷팅 이슈는 지양하고, 시스템 안정성과 비즈니스 로직 결함에 집중하세요.
        - 리뷰 코멘트는 친절하고 명확한 한국어로 작성하며, 구체적인 코드 예시를 함께 제시하세요.

  auto_review:
    enabled: true
    ignore_title_keywords:
      - "chore"
      - "docs"
      - "style"

chat:
  auto_reply: true
