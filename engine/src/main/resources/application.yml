spring:
  application:
    name: slice-stream-engine

  config:
    import: "optional:file:.env[.properties]"

  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: redis
      port: 6379

  kafka:
    bootstrap-servers: kafka:29092

    consumer:
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "io.slice.stream.engine.*"

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    # 채팅 메시지 한 줄씩 찍히는 노이즈 차단 (WARN 레벨 이상만 출력)
    io.slice.stream.engine.chat.infrastructure.chzzk.websocket.ChzzkWebSocketListener: WARN
    # 채팅 수집기 연결 로그 차단
    io.slice.stream.engine.chat.infrastructure.kafka.ChzzkChatCollector: WARN
    # (선택 사항) Kafka 컨슈머의 노이즈가 많을 경우 추가
    org.apache.kafka: WARN

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

  endpoint:
    prometheus:
      enabled: true

  metrics:
    tags:
      application: engine
    distribution:
      percentiles-histogram:
        analysis.processing.time: true

chzzk:
  # 1. 치지직 오픈 API (방송 정보 조회 등)
  api:
    base-url: "https://api.chzzk.naver.com"
    live-fetch: "/service/v1/lives"
    live-detail-fetch: "/service/v2/channels/{channelId}/live-detail"

  # 2. 치지직 게임 API (토큰 발급용 - 별도 도메인)
  game-api:
    base-url: "https://comm-api.game.naver.com"

  # 3. 수집할 방송 갯수
  discovery:
    limit: 100

api-server:
  host: ${SERVER_HOST}
  path: ${SIGNAL_PATH}
  sync-path: ${SYNC_PATH}
  meta-path: ${META_PATH}
  secret: ${SERVER_SECRET}
  header: ${SERVER_HEADER}

highlight:
  engine:
    # 1. 스케줄러 및 시간 설정
    scheduler-interval-ms: 3000       # 엔진 실시간 분석 주기 (3초)
    manager-refresh-ms: 180000        # 매니저 체급 갱신 주기 (3분)
    masking-time-ms: 12000            # 마스킹 배제할 과거 시간 (12초)
    fetch-buffer-seconds: 15          # Redis 조회 시 여유분 (15초)

    # 2. 오토스케일링 및 백분위 설정
    percentile-cut: 0.99              # 동적 임계치 상위 % (상위 1%)
    cold-start-weight: 0.005          # 방송 초기 시청자수 가중치 (0.5%)

    # 3. 체급별 세부 파라미터
    tier:
      group-a:
        window-seconds: 60            # 대형방 과거 윈도우 (1분)
        z-score: 3.5                  # 대형방 허들
        condition-min-avg: 4.0        # 대형방 승급 조건 (30분 평균 화력)
        condition-min-peak: 30        # 대형방 승급 조건 (30분 내 최고 화력)
      group-b:
        window-seconds: 120           # 성장형 과거 윈도우 (2분)
        z-score: 4.5                  # 성장형 허들

# 커스텀 스레드 풀 스위칭 설정
app:
  thread:
    mode: virtual                     # 기본값은 'virtual'로 둔다.
    pool-size: 100                    # platform 모드일 때 생성할 스레드 개수
