spring:
  application:
    name: slice-stream-engine

  config:
    import: "optional:file:.env[.properties]"

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DW_DB_HOST:dw-postgres}:${DW_DB_PORT:5432}/${DW_DB_NAME:cheesepick_dw}?reWriteBatchedInserts=true&connectTimeout=3&socketTimeout=5
    username: ${DW_DB_USER:sliceuser}
    password: ${DW_DB_PASSWORD:slicepass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000

  data:
    redis:
      host: redis
      port: 6379

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, threaddump

  endpoint:
    prometheus:
      enabled: true

  metrics:
    tags:
      application: engine
    distribution:
      percentiles-histogram:
        analysis.processing.time: true

chzzk:
  # 1. 치지직 오픈 API (방송 정보 조회 등)
  api:
    base-url: "https://api.chzzk.naver.com"
    live-fetch: "/service/v1/lives"
    # [기존 v2 상세 API 보존]
    live-detail-fetch-v2: "/service/v2/channels/{channelId}/live-detail"
    # [v3 상세 API - accumulateCount 누적 시청자 수 추가 수집 지원]
    live-detail-fetch: "/service/v3/channels/{channelId}/live-detail"
    # [웹소켓 연결용 경량 상태 폴링 API]
    live-status-polling: "/polling/v2/channels/{channelId}/live-status"
    # [채널 기본 정보 및 팔로워 조회 API]
    channel-fetch: "/service/v1/channels/{channelId}"
    default-chrome-version: "152.0.0.0"
    version-api-url: "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"

  # 2. 치지직 게임 API (토큰 발급용 - 별도 도메인)
  game-api:
    base-url: "https://comm-api.game.naver.com"

  # 3. 수집할 방송 갯수
  discovery:
    limit: 200

  # 4. 일일 팔로워 정기 수집기 설정 (채팅 웹소켓 풀과 독립)
  collector:
    follower:
      cron: "0 30 3 * * *"
      tps: 10.0

api-server:
  host: ${SERVER_HOST}
  internal-prefix: ${INTERNAL_API_PREFIX:/api/v1}
  secret: ${SERVER_SECRET}
  header: ${SERVER_HEADER}

  signal-path: ${api-server.internal-prefix}/signals
  sync-path: ${api-server.internal-prefix}/sync
  meta-path: ${api-server.internal-prefix}/segments
  summary-path: ${api-server.internal-prefix}/summaries/{streamId}
  targets-path: ${api-server.internal-prefix}/targets
  follower-targets-path: ${api-server.internal-prefix}/follower-targets
  follower-snapshots-path: ${api-server.internal-prefix}/follower-snapshots

targeting:
  trend-redis-key: "target:streamers:pool"

# 커스텀 스레드 풀 스위칭 설정
app:
  thread:
    mode: virtual                      # 기본값은 'virtual'로 둔다. 'platform' 플랫폼 스레드
    pool-size: 200                    # platform 모드일 때 생성할 스레드 개수


