spring:
  application:
    name: slice-stream-engine

  config:
    import: "optional:file:.env[.properties]"

  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: redis
      port: 6379

  kafka:
    bootstrap-servers: kafka:29092

    consumer:
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "io.slice.stream.*"

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    org.apache.kafka: WARN

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, threaddump

  endpoint:
    prometheus:
      enabled: true

  metrics:
    tags:
      application: engine
    distribution:
      percentiles-histogram:
        analysis.processing.time: true

chzzk:
  # 1. 치지직 오픈 API (방송 정보 조회 등)
  api:
    base-url: "https://api.chzzk.naver.com"
    live-fetch: "/service/v1/lives"
    # [기존 v2 상세 API 보존]
    live-detail-fetch-v2: "/service/v2/channels/{channelId}/live-detail"
    # [v3 상세 API - accumulateCount 누적 시청자 수 추가 수집 지원]
    live-detail-fetch: "/service/v3/channels/{channelId}/live-detail"
    # [웹소켓 연결용 경량 상태 폴링 API]
    live-status-polling: "/polling/v2/channels/{channelId}/live-status"
    # [채널 기본 정보 및 팔로워 조회 API]
    channel-fetch: "/service/v1/channels/{channelId}"
    default-chrome-version: "152.0.0.0"
    version-api-url: "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"

  # 2. 치지직 게임 API (토큰 발급용 - 별도 도메인)
  game-api:
    base-url: "https://comm-api.game.naver.com"

  # 3. 수집할 방송 갯수
  discovery:
    limit: 200

  # 4. 일일 팔로워 정기 수집기 설정 (채팅 웹소켓 풀과 독립)
  collector:
    follower:
      cron: "0 30 3 * * *"
      tps: 5.0

api-server:
  host: ${SERVER_HOST}
  internal-prefix: ${INTERNAL_API_PREFIX:/api/v1}
  secret: ${SERVER_SECRET}
  header: ${SERVER_HEADER}

  signal-path: ${api-server.internal-prefix}/signals
  sync-path: ${api-server.internal-prefix}/sync
  meta-path: ${api-server.internal-prefix}/segments
  summary-path: ${api-server.internal-prefix}/summaries/{streamId}
  targets-path: ${api-server.internal-prefix}/targets
  follower-targets-path: ${api-server.internal-prefix}/follower-targets
  follower-snapshots-path: ${api-server.internal-prefix}/follower-snapshots

targeting:
  trend-redis-key: "target:streamers:pool"

highlight:
  engine:
    # 1. 스케줄러 및 시간 설정
    scheduler-interval-ms: 3000       # 엔진 실시간 분석 주기 (3초)
    manager-refresh-ms: 180000        # 매니저 체급 갱신 주기 (3분)
    masking-time-ms: 12000            # 마스킹 배제할 과거 시간 (12초)
    fetch-buffer-seconds: 15          # Redis 조회 시 여유분 (15초)

    # 2. 오토스케일링 및 백분위 설정
    percentile-cut: 0.99              # 동적 임계치 상위 % (상위 1%)
    cold-start-weight: 0.005          # 방송 초기 시청자수 가중치 (0.5%)

    # 3. 체급별 세부 파라미터
    tier:
      mega:
        window-seconds: 180           # 대형방 과거 윈도우 (3분, 60틱)
        z-score: 4.0                  # 대형방 허들 (일상 잡담 필터링을 위해 4.0으로 상향)
        condition-min-avg: 3.0        # 대형방 승급 조건 (30분 평균 3.0건/3초)
        condition-min-peak: 30        # 대형방 승급 조건 (30분 최고 피크 30건/3초)
        noise-floor: 16               # 최소 화력 바닥값 (16건/3초, 슈퍼플레이 보존 및 잡담 억제)
      regular:
        window-seconds: 180           # 중형방 과거 윈도우 (3분, 60틱)
        z-score: 3.5                  # 중형방 허들
        condition-min-avg: 0.8        # 중형방 승급 조건 (30분 평균 0.8건/3초)
        condition-min-peak: 10        # 중형방 승급 조건 (30분 최고 피크 10건/3초)
        noise-floor: 6                # 최소 화력 바닥값 (6건/3초)
      micro:
        window-seconds: 180           # 소형방/신규 과거 윈도우 (3분, 60틱)
        z-score: 4.0                  # 소형방 허들 (도서관 헛기침 방어)
        noise-floor: 5                # 최소 화력 바닥값 (5건/3초)

# 커스텀 스레드 풀 스위칭 설정
app:
  thread:
    mode: virtual                      # 기본값은 'virtual'로 둔다. 'platform' 플랫폼 스레드
    pool-size: 200                    # platform 모드일 때 생성할 스레드 개수

chat:
  sampler:
    temp-dir: "data/chat-samples"

