x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.5}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:?AIRFLOW_DB_USER is required}:${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}@airflow-postgres:5432/${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY is required}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-${AIRFLOW_FERNET_KEY}}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__CORE__PARALLELISM: 8
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 4
    AIRFLOW_CONN_SLICE_OCI_POSTGRES: postgresql+psycopg2://${OCI_DB_USER:-sliceuser}:${OCI_DB_PASSWORD:-slicepass}@oci-db-tunnel:5432/${OCI_DB_NAME:-slicedb}
    OCI_NAMESPACE: ${OCI_NAMESPACE:-}
    OCI_REGION: ${OCI_REGION:-ap-chuncheon-1}
    OCI_BUCKET_NAME: ${OCI_BUCKET_NAME:-slice-data-lake}
    OCI_ACCESS_KEY_ID: ${OCI_ACCESS_KEY_ID:-}
    OCI_SECRET_ACCESS_KEY: ${OCI_SECRET_ACCESS_KEY:-}
    TZ: Asia/Seoul
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - /home/ubuntu/cheese-pick/chat-samples:/opt/airflow/data/chat_samples
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - slice-network
  depends_on:
    &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy

services:
  airflow-postgres:
    image: postgres:17-alpine
    container_name: slice-airflow-postgres
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:?AIRFLOW_DB_USER is required}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
      TZ: Asia/Seoul
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - slice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  dw-postgres:
    image: postgres:17-alpine
    container_name: slice-dw-postgres
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "effective_cache_size=768MB"
    ports:
      - "${DW_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${DW_DB_USER:?DW_DB_USER is required}
      POSTGRES_PASSWORD: ${DW_DB_PASSWORD:?DW_DB_PASSWORD is required}
      POSTGRES_DB: ${DW_DB_NAME:-cheesepick_dw}
      TZ: Asia/Seoul
    volumes:
      - dw_postgres_data:/var/lib/postgresql/data
    networks:
      - slice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  dw-flyway:
    image: flyway/flyway:10-alpine
    container_name: slice-dw-flyway
    command: ["migrate"]
    environment:
      FLYWAY_URL: jdbc:postgresql://dw-postgres:5432/${DW_DB_NAME:-cheesepick_dw}
      FLYWAY_USER: ${DW_DB_USER:?DW_DB_USER is required}
      FLYWAY_PASSWORD: ${DW_DB_PASSWORD:?DW_DB_PASSWORD is required}
      FLYWAY_CONNECT_RETRIES: 10
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/migrations:/flyway/sql:ro
    networks:
      - slice-network
    depends_on:
      dw-postgres:
        condition: service_healthy

  oci-db-tunnel:
    image: alpine:3.20
    container_name: slice-oci-db-tunnel
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache openssh-client
        cp /tmp/oci_ssh_key /root/oci_key
        chmod 600 /root/oci_key
        exec ssh -i /root/oci_key \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o ExitOnForwardFailure=yes \
          -o ServerAliveInterval=15 \
          -o ServerAliveCountMax=3 \
          -N -L 0.0.0.0:5432:127.0.0.1:5432 \
          ${OCI_SSH_USER:-ubuntu}@${OCI_SSH_HOST:-140.245.72.152}
    volumes:
      - ${OCI_SSH_KEY_PATH:-/home/ubuntu/.ssh/oci_api_server.key}:/tmp/oci_ssh_key:ro
    networks:
      - slice-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M

  airflow-init:
    <<: *airflow-common
    container_name: slice-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        if [[ -z "$${_AIRFLOW_WWW_USER_USERNAME:-}" || -z "$${_AIRFLOW_WWW_USER_PASSWORD:-}" ]]; then
          echo "ERROR: _AIRFLOW_WWW_USER_USERNAME and _AIRFLOW_WWW_USER_PASSWORD must be set." >&2
          exit 1
        fi
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
        /entrypoint airflow db migrate
        if ! /entrypoint airflow users list | awk '{print $$2}' | grep -Fxq "$${_AIRFLOW_WWW_USER_USERNAME}"; then
          /entrypoint airflow users create \
            --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
            --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
            --firstname Admin \
            --lastname User \
            --role Admin \
            --email admin@cheesepick.me
        fi
    environment:
      <<: *airflow-common-env
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:?_AIRFLOW_WWW_USER_USERNAME is required}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:?_AIRFLOW_WWW_USER_PASSWORD is required}
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    container_name: slice-airflow-apiserver
    command: api-server
    ports:
      - "${AIRFLOW_WEB_PORT:-8085}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      dw-flyway:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  airflow-scheduler:
    <<: *airflow-common
    container_name: slice-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      dw-flyway:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M

  airflow-dag-processor:
    <<: *airflow-common
    container_name: slice-airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      dw-flyway:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  airflow_postgres_data:
  dw_postgres_data:

networks:
  slice-network:
    external: true
    name: slice-network
