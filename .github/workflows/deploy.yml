name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ---------------------------------------------------
  # 0. 어떤 모듈이 변경되었는지 감지
  # ---------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api_server: ${{ steps.filter.outputs.api_server == 'true' || github.event_name == 'workflow_dispatch' }}
      engine: ${{ steps.filter.outputs.engine == 'true' || github.event_name == 'workflow_dispatch' }}
      collector: ${{ steps.filter.outputs.collector == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Files
        id: filter
        run: |
          # 머지 전 기준 커밋(BASE) 결정: 이벤트의 before 또는 머지 커밋의 부모 1
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          elif git rev-parse HEAD^2 >/dev/null 2>&1; then
            BASE="HEAD^1"
          else
            BASE="HEAD~1"
          fi

          echo "기준 커밋(BASE): $BASE"
          CHANGED_FILES=$(git diff --name-only "$BASE" HEAD)
          echo "=== 변경된 파일 목록 ==="
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -q '^api-server/'; then
            echo "api_server=true" >> $GITHUB_OUTPUT
          else
            echo "api_server=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED_FILES" | grep -q '^engine/' || echo "$CHANGED_FILES" | grep -q '^core/'; then
            echo "engine=true" >> $GITHUB_OUTPUT
          else
            echo "engine=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED_FILES" | grep -q '^collector/' || echo "$CHANGED_FILES" | grep -q '^core/'; then
            echo "collector=true" >> $GITHUB_OUTPUT
          else
            echo "collector=false" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------
  # 1. API 서버 빌드 및 배포 (OCI Flex1 - ARM64)
  # ---------------------------------------------------
  deploy-api-server:
    needs: detect-changes
    if: needs.detect-changes.outputs.api_server == 'true'
    runs-on: [self-hosted, ARM64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 커밋 해시 7자리 추출
      - name: Set Image Tag
        id: set-tag
        run: echo "TAG=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build api-server with Gradle
        run: ./gradlew :api-server:bootJar -x test

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push api-server
        run: |
          docker build -t firedrago/api-server:${{ env.TAG }} -f ./api-server/Dockerfile .
          docker push firedrago/api-server:${{ env.TAG }}

      - name: Deploy api-server
        # 확인된 실제 경로 적용
        working-directory: /home/ubuntu/cheese-pick/api
        run: |
          grep -v '^API_VERSION=' .env > .env.tmp || true
          mv .env.tmp .env
          echo "API_VERSION=${{ env.TAG }}" >> .env
          
          # 확인된 서비스명 'api' 적용
          docker compose pull api
          docker compose up -d --no-deps api
          docker image prune -af --filter "until=24h"
          docker builder prune -f --filter "until=48h"

  # ---------------------------------------------------
  # 2. 엔진 빌드 및 배포 (홈서버 - AMD64)
  # ---------------------------------------------------
  deploy-engine:
    needs: detect-changes
    if: needs.detect-changes.outputs.engine == 'true'
    concurrency:
      group: cheese-pick-compose-deploy
      cancel-in-progress: false
    runs-on: [self-hosted, X64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 커밋 해시 7자리 추출
      - name: Set Image Tag
        id: set-tag
        run: echo "TAG=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build engine with Gradle
        run: ./gradlew :engine:bootJar -x test

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push engine
        run: |
          docker build -t firedrago/engine:${{ env.TAG }} -f ./engine/Dockerfile .
          docker push firedrago/engine:${{ env.TAG }}

      - name: Deploy engine
        # 확인된 실제 경로 적용
        working-directory: /home/ubuntu/cheese-pick
        run: |
          grep -v '^ENGINE_VERSION=' .env > .env.tmp || true
          mv .env.tmp .env
          echo "ENGINE_VERSION=${{ env.TAG }}" >> .env
          
          docker compose pull engine
          docker compose up -d --no-deps engine
          docker image prune -af --filter "until=24h"
          docker builder prune -f --filter "until=48h"

  # ---------------------------------------------------
  # 3. 수집기(Collector) 빌드 및 배포 (홈서버 - AMD64)
  # ---------------------------------------------------
  deploy-collector:
    needs: detect-changes
    if: needs.detect-changes.outputs.collector == 'true'
    concurrency:
      group: cheese-pick-compose-deploy
      cancel-in-progress: false
    runs-on: [self-hosted, X64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 커밋 해시 7자리 추출
      - name: Set Image Tag
        id: set-tag
        run: echo "TAG=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build collector with Gradle
        run: ./gradlew :collector:bootJar -x test

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push collector
        run: |
          docker build -t firedrago/collector:${{ env.TAG }} -f ./collector/Dockerfile .
          docker push firedrago/collector:${{ env.TAG }}

      - name: Deploy collector
        working-directory: /home/ubuntu/cheese-pick
        run: |
          grep -v '^COLLECTOR_VERSION=' .env > .env.tmp || true
          mv .env.tmp .env
          echo "COLLECTOR_VERSION=${{ env.TAG }}" >> .env
          
          docker compose pull collector
          docker compose up -d --no-deps collector
          docker image prune -af --filter "until=24h"
          docker builder prune -f --filter "until=48h"

