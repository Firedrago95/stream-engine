services:
  redis:
    image: redis/redis-stack-server:7.2.0-v14
    container_name: slice-redis
    ports:
      - "6379:6379"
    networks:
      - slice-network
  kafka:
    image: bitnami/kafka:3.9.6-debian-12-r3
    container_name: slice-kafka
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller.broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
    networks:
      - slice-network
  engine:
    image: ${DOCKER_HUB_ID}/engine:latest
    container_name: slice-engine
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_HOST=redis
      - JAVA_OPTS=-Xmx2G -Xms2G
    ports:
      - "9091:9090"
    depends_on:
      - kafka
      - redis
    networks:
      - slice-network

networks:
  slice-network:
    name: slice-network
    driver: bridge
