spring:
  application:
    name: slice-stream-api-server

  config:
    import: "optional:file:.env[.properties]"

  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slicedb}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

  endpoint:
    prometheus:
      enabled: true

  metrics:
    tags:
      application: api-server
    enable:
      spring.data.repository: false
    distribution:
      percentiles-histogram:
        http.server.requests: false
      slo:
        http.server.requests: 50ms, 100ms, 250ms, 500ms, 1s, 2s, 3s, 5s

analysis:
  internal-prefix: ${INTERNAL_API_PREFIX}
  secret: ${SERVER_SECRET}
  header: ${SERVER_HEADER}
  signal:
    path: ${analysis.internal-prefix}/signals
  sync:
    path: ${analysis.internal-prefix}/sync
  meta:
    path: ${analysis.internal-prefix}/segments
  summary:
    path: ${analysis.internal-prefix}/summaries

highlight:
  leading-buffer: 20s           # 피크 발생 20초 전부터 영상 시작
  trailing-buffer: 5s           # 피크 발생 5초 후까지 영상 유지
  cooldown: 60s                 # 새로운 세션 만들지 않고 무시/병합하는 억제 기간
  extension-ratio: 0.7          # 기존 최대 화력 대비 여진으로 인정할 비율 (Dynamic Sliding Window)
  minimum: 5                    # 하이라이트로 인정될 최소 화력 (절대값)
  realtime-limit: 6             # 실시간 하이라이트는 6개만 조회
  history-display-limit: 20     # 방종후 24시간 동안 하이라이트는 20개만 조회
  cleanup-retention-limit: 10   # 방종후 24시간 이후 하이라이트는 10개만 남기고 삭제
  cleanup-grace-hours: 24       # 방종후 하이라이트 삭제 기간
  highlight-retention-days: 30  # 방종후 30일 지난 하이라이트 및 세그먼트 완전 삭제
  session-retention-days: 365   # 방종후 365일(1년) 지난 방송 세션 기록 삭제 (잔디 최대 1년 지원)

category:
  ranking:
    timeline-interval-seconds: ${TIMELINE_INTERVAL_SECONDS:30}

