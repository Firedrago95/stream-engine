spring:
  application:
    name: slice-stream-api-server

  config:
    import: "optional:file:.env[.properties]"

  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slicedb}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

  endpoint:
    prometheus:
      enabled: true

  metrics:
    tags:
      application: api-server
    enable:
      spring.data.repository: false
    distribution:
      percentiles-histogram:
        http.server.requests: false
      slo:
        http.server.requests: 50ms, 100ms, 250ms, 500ms, 1s, 2s, 3s, 5s

analysis:
  internal-prefix: ${INTERNAL_API_PREFIX}
  secret: ${SERVER_SECRET}
  header: ${SERVER_HEADER}
  signal:
    path: ${analysis.internal-prefix}/signals
  sync:
    path: ${analysis.internal-prefix}/sync
  meta:
    path: ${analysis.internal-prefix}/segments
  summary:
    path: ${analysis.internal-prefix}/summaries

highlight:
  leading-buffer: 40s           # 피크 발생 40초 전부터 영상 시작 (스토리/컷씬 빌드업 및 맥락 확보)
  trailing-buffer: 10s          # 피크 발생 10초 후까지 영상 유지
  cooldown: 60s                 # 새로운 세션 만들지 않고 무시/병합하는 억제 기간 (연쇄 한타 단일 씬 병합)
  extension-ratio: 0.7          # 기존 최대 화력 대비 여진으로 인정할 비율 (Dynamic Sliding Window)
  minimum: 5                    # 하이라이트로 인정될 최소 화력 (엔진 min-floor 5와 일치)
  realtime-limit: 50            # 실시간 하이라이트 조회 한도 (프론트에서 Top 6 및 더보기 처리)
  history-display-limit: 50     # 방종후 하이라이트 조회 한도 (프론트에서 Top 6 및 더보기 처리)
  cleanup-retention-limit: 10   # 30일 경과 후 하이라이트는 Top 10만 압축 보존
  cleanup-grace-days: 30        # 하이라이트 전량 보존 기간 (일, 30일 경과 후 Top 10 압축)
  highlight-retention-days: 365 # 방종후 365일(1년) 지난 하이라이트 완전 삭제
  session-retention-days: 365   # 방종후 365일(1년) 지난 방송 세션 기록 삭제 (잔디 최대 1년 지원)

category:
  ranking:
    timeline-interval-seconds: ${TIMELINE_INTERVAL_SECONDS:30}

session:
  re-live-gap: 6m               # 리방(Re-Live) 인정 최대 공백 시간
  noise-threshold: 5m           # 유효 방송 최소 지속 시간 (미만 노이즈 필터링)
  recent-fetch-limit: 50        # 연관 세션 탐색 한도

admin:
  secret-key: ${ADMIN_SECRET_KEY:}




